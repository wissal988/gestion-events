server:
  port: 8080

spring:
  application:
    name: api-gateway

# Configurer Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

# Routes Gateway
spring:
  cloud:
    gateway:
      routes:
        - id: authservice
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        - id: eventservice
          uri: http://localhost:8082
          predicates:
            - Path=/events/** 
          filters:
            - StripPrefix=1

        - id: partiservice
          uri: http://localhost:8083
          predicates:
            - Path=/partis/** 
          filters:
            - StripPrefix=1
